<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>NoTube Playlist – Réglages</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --border:#e3e6eb; --accent:#d63a3a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --card:#1e2128; --text:#e8eaee; --muted:#9aa1ad; --border:#2e333c; } }
    body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Segoe UI",sans-serif; }
    main { max-width:640px; margin:0 auto; }
    h1 { font-size:20px; margin:0 0 16px; }
    fieldset { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin:0 0 14px; }
    legend { font-weight:600; padding:0 6px; }
    label { display:grid; grid-template-columns: 1fr 210px; align-items:center; column-gap:12px; padding:6px 0; }
    label small { grid-column:1; display:block; color:var(--muted); font-size:12px; }
    label input, label select { grid-column:2; grid-row:1 / span 2; }
    input, select { font:inherit; padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); width:100%; }
    input[type=checkbox] { width:auto; justify-self:start; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    #msg { color:var(--muted); }
    @media (max-width:520px) { label { grid-template-columns:1fr; } label input, label select { grid-column:1; grid-row:auto; margin-top:4px; } }
  </style>
</head>
<body>
<main>
  <h1>NoTube Playlist : réglages</h1>

  <fieldset>
    <legend>Fichiers</legend>
    <label>Sous-dossier de sortie<small>Dans votre dossier Téléchargements. Ex. : Musique</small><input id="folder" type="text"></label>
    <label>Format<small>Format demandé à noTube</small>
      <select id="format">
        <option value="mp3">MP3</option>
        <option value="mp3hd">MP3 HD</option>
        <option value="m4a">M4A</option>
        <option value="wav">WAV</option>
      </select>
    </label>
    <label>Nettoyer les titres<small>Retire « (Clip Officiel) », « [Official Video] », « (Lyrics) »… du nom du fichier</small><input id="cleanTitles" type="checkbox"></label>
    <label>Écrire titre et artiste dans le MP3<small>Pour que votre lecteur de musique affiche le bon titre et le bon artiste</small><input id="writeTags" type="checkbox"></label>
    <label>Taille minimale (Ko)<small>En dessous, le fichier est considéré comme raté et supprimé</small><input id="minSizeKb" type="number" min="1"></label>
    <label>Mode de téléchargement<small>« Lien direct » évite les publicités ; « Clic » imite un utilisateur</small>
      <select id="downloadMode">
        <option value="direct">Lien direct (recommandé)</option>
        <option value="click">Clic sur le bouton</option>
      </select>
    </label>
  </fieldset>

  <fieldset>
    <legend>Rythme</legend>
    <label>Pause minimale entre deux titres (s)<input id="pauseMinSec" type="number" min="0"></label>
    <label>Pause maximale entre deux titres (s)<input id="pauseMaxSec" type="number" min="0"></label>
    <label>Titres par heure au maximum<small>Plafond de débit</small><input id="maxPerHour" type="number" min="1"></label>
    <label>Pause après une limite noTube (min)<small>Utilisée si noTube n’affiche pas lui-même la durée d’attente</small><input id="limitPauseMin" type="number" min="1"></label>
  </fieldset>

  <fieldset>
    <legend>Fiabilité</legend>
    <label>Essais par titre<input id="maxAttempts" type="number" min="1" max="10"></label>
    <label>Délai max de conversion (s)<small>Watchdog : au-delà, le titre est abandonné puis réessayé</small><input id="watchdogSec" type="number" min="30"></label>
    <label>Délai max du téléchargement (s)<input id="downloadTimeoutSec" type="number" min="30"></label>
    <label>Alerte après N échecs consécutifs<input id="alertAfterFailures" type="number" min="1"></label>
    <label>Journal détaillé dans la console<small>Préfixe [NoTube-Playlist]</small><input id="debug" type="checkbox"></label>
  </fieldset>

  <div class="actions">
    <button id="save" class="primary">Enregistrer</button>
    <button id="reset">Valeurs par défaut</button>
    <button id="simulate">Simuler un captcha au prochain titre</button>
    <span id="msg"></span>
  </div>
</main>
<script src="../lib/util.js"></script>
<script src="../lib/storage.js"></script>
<script src="options.js"></script>
</body>
</html>
